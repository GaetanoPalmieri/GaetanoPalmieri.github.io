<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12181f" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f1f2ed" media="(prefers-color-scheme: light)">
<title>Le mie app</title>
<!-- Pagina iniziale: va nel repository speciale <nomeutente>.github.io, così si apre su https://<nomeutente>.github.io/.
     Ogni "dir" in APPS è il nome di un repository (maiuscole e minuscole contano). -->
<style>
  :root{--bg:#12181f;--card:rgba(27,35,44,.62);--edge:rgba(255,255,255,.07);--ink:#f1f5f4;--soft:#9fb0ab;color-scheme:dark;}
  @media (prefers-color-scheme: light){:root{--bg:#f1f2ed;--card:rgba(255,255,255,.78);--edge:rgba(20,24,26,.08);--ink:#14181a;--soft:#4b5450;color-scheme:light;}}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{background:var(--bg);}
  body{margin:0;min-height:100dvh;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(42% 30% at 10% 6%,rgba(232,163,61,.14),transparent 70%),radial-gradient(38% 30% at 96% 34%,rgba(58,166,132,.18),transparent 70%),radial-gradient(46% 34% at 26% 90%,rgba(110,120,230,.13),transparent 72%),var(--bg);background-attachment:fixed;}
  main{max-width:560px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));}
  h1{margin:0 0 4px;font-size:28px;letter-spacing:-.01em;}
  .sub{margin:0 0 22px;color:var(--soft);font-size:14px;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  a.app{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px;border-radius:20px;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--edge);
    box-shadow:0 12px 30px -14px rgba(0,0,0,.45);-webkit-backdrop-filter:blur(14px) saturate(1.5);backdrop-filter:blur(14px) saturate(1.5);transition:transform .15s ease;}
  a.app:active{transform:scale(.97);}
  a.app img{width:58px;height:58px;border-radius:14px;box-shadow:0 6px 16px -6px rgba(0,0,0,.4);background:#1b232c;}
  a.app strong{font-size:17px;}
  a.app span{font-size:13px;color:var(--soft);line-height:1.35;}
  .tip{margin:22px 2px 0;font-size:12.5px;color:var(--soft);line-height:1.5;}
  @media (max-width:340px){.grid{grid-template-columns:1fr;}}
</style>
</head>
<body>
<main>
  <h1>Le mie app</h1>
  <p class="sub">Tocca un'app per aprirla.</p>
  <div class="grid" id="apps"></div>
  <p class="tip">Su iPhone: apri l'app, poi Condividi › Aggiungi alla schermata Home. Ogni app aggiunta alla Home tiene i suoi dati sul telefono.</p>
</main>
<script>
  const APPS = [
    { dir: 'money_tracker', icon: 'icons/icon-192.png', name: 'Bilancio', text: 'Conti, spese, ricorrenti e prestiti' },
    { dir: 'Noi_due', icon: 'icons/icon-192.png', name: 'Noi Due', text: 'Spese di coppia e liste della spesa' },
    { dir: 'gym_tracker', icon: 'gym-icon-192.png', name: 'RecompApp', text: 'Allenamento, nutrizione e peso' },
    { dir: 'Style_app', icon: 'icon-192.png', name: 'Style', text: 'Wishlist, acquisti e guardaroba' },
  ];
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  document.getElementById('apps').innerHTML = APPS.map((a) => `<a class="app" href="./${esc(a.dir)}/"><img src="./${esc(a.dir)}/${esc(a.icon)}" alt="" onerror="this.style.visibility='hidden'"><strong>${esc(a.name)}</strong><span>${esc(a.text)}</span></a>`).join('');
</script>
</body>
</html>
